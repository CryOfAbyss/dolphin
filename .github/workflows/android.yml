name: Build Dolphin Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ""

      - name: Daftar paket tersedia
        run: sdkmanager --list --channel=3 | grep -E "ndk;30|platforms;android-37|cmake;3.31" || true

      - name: Pasang komponen Android
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager --channel=3 --install platforms\;android-37.0 ndk\;30.0.15729638 cmake\;3.31.6

      - name: Build APK
        working-directory: Source/Android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Dolphin-Android-APK
          path: Source/Android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
